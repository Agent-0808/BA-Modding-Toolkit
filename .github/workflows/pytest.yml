name: Run Tests

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install Dependencies
        run: uv sync --dev

      - name: Download Test Assets
        env:
          ASSETS_URL: ${{ secrets.ASSETS_URL }}
        run: |
          try {
            if ([string]::IsNullOrEmpty($env:ASSETS_URL)) {
              throw "ASSETS_URL secret is not set"
            }
            Invoke-WebRequest -Uri $env:ASSETS_URL -OutFile "assets.zip" -ErrorAction Stop
            Expand-Archive -Path "assets.zip" -DestinationPath "tests\assets" -Force
            Remove-Item "assets.zip"
            Write-Host "Test assets downloaded and extracted successfully"
          } catch {
            Write-Host "Failed to download test assets, skipping..."
          }
        shell: pwsh
        continue-on-error: true

      # 下载外部测试工具（仓库 variables 配置 release 直链后启用；未配置时相关测试自动跳过）
      - name: Download External Test Tools
        if: vars.SKEL_CONVERTER_URL != ''
        run: |
          New-Item -ItemType Directory -Path "tests/assets/external_tools/converter" -Force
          Invoke-WebRequest ${{ vars.SKEL_CONVERTER_URL }} -OutFile "tests/assets/external_tools/converter/SpineSkeletonDataConverter.exe"
          Invoke-WebRequest ${{ vars.SPINE_VIEWER_URL }} -OutFile viewer.zip
          Expand-Archive viewer.zip tests/assets/external_tools/viewer -Force
        shell: pwsh

      # SKIP_SPINE_RENDER：CI 软件渲染（llvmpipe）与 SFML 2.6 纹理回读不兼容（进程静默崩溃），
      # 渲染类测试自动跳过；query / 版本转换不受影响，渲染正确性由本地硬件 GL 环境验证
      - name: Run Tests
        run: uv run pytest -v
        env:
          SKIP_SPINE_RENDER: '1'
